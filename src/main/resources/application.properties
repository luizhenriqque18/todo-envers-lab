spring.application.name=todo-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/todo}
spring.datasource.username=${DB_USER:todo}
spring.datasource.password=${DB_PASSWORD:todo_local}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.modified_flag_suffix=_mod
spring.flyway.enabled=true
